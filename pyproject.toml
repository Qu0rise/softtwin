[project]
name = "softtwin"
version = "2.0.0"
description = "Soft pneumatic gripper without a force sensor: skin-located proprioceptive force estimate, firmness plunger, one control core shared by MuJoCo and Isaac Sim (PhysX)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "mujoco==3.15.0",
  "numpy>=2.0,<3",
  "scipy>=1.13",
  "pillow>=10",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "pandas>=2.2",
  "imageio[ffmpeg]>=2.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["docs/figures/teaser_raw", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E731"]
# sim/isaac_jobs/* are executed inside the Kit script namespace of the bridge (top-level await, frames() and build() come from there)
per-file-ignores = { "scripts/*" = ["E402"], "tests/*" = ["E402"], "sim_mujoco/*" = ["E402"], "ros2/*" = ["E402"], "sim/isaac_jobs/*" = ["E401", "E402", "F704", "F821"], "sim/isaac_headless/*" = ["E402"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
